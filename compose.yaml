
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./Backend
    image: cipherpass-backend:latest
    env_file:
      - ./Backend/.env.docker
    environment:
      MONGODB_URI: mongodb://mongo:27017
      PORT: "8000"
      CORS_ORIGIN: http://localhost:8080
      FRONT_END_URL: http://localhost:8080
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ./Frontend
    image: cipherpass-frontend:latest
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend

volumes:
  mongo_data:
